<template id="scene5-logo-outro-template">
  <div
    id="scene5-logo-outro"
    data-composition-id="scene5-logo-outro"
    data-width="1920"
    data-height="1080"
    data-duration="5.5"
  >
    <div class="canvas">
      <!-- Ambient glows -->
      <div class="glow-center"></div>
      <div class="glow-top"></div>

      <!-- Grid overlay -->
      <div class="bg-grid"></div>

      <!-- Logo image -->
      <div class="logo-wrap">
        <img class="logo-img" src="../assets/dynamous-logo.png" alt="Dynamous" />
      </div>

      <!-- Text content -->
      <div class="text-block">
        <div class="tagline">Master AI and Gain the</div>
        <div class="tagline-accent">Ultimate Unfair Advantage.</div>
        <div class="url-pill">
          <div class="url-dot"></div>
          <span class="url-text">dynamous.ai</span>
        </div>
      </div>
    </div>

    <style>
      #scene5-logo-outro .canvas {
        width: 1920px;
        height: 1080px;
        background: #09090B;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Inter", sans-serif;
      }

      #scene5-logo-outro .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(59,130,246,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(59,130,246,0.05) 1px, transparent 1px);
        background-size: 80px 80px;
        pointer-events: none;
        opacity: 0;
      }

      #scene5-logo-outro .glow-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        width: 1000px;
        height: 1000px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0,128,255,0.18) 0%, transparent 65%);
        opacity: 0;
        pointer-events: none;
      }

      #scene5-logo-outro .glow-top {
        position: absolute;
        top: -300px;
        left: 50%;
        transform: translateX(-50%) scale(0);
        width: 800px;
        height: 800px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 65%);
        opacity: 0;
        pointer-events: none;
      }

      #scene5-logo-outro .logo-wrap {
        position: relative;
        z-index: 2;
        opacity: 0;
        transform: translateY(-30px) scale(0.85);
        margin-bottom: 48px;
      }

      #scene5-logo-outro .logo-img {
        height: 72px;
        width: auto;
        filter: brightness(1.05);
      }

      #scene5-logo-outro .text-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        z-index: 2;
      }

      #scene5-logo-outro .tagline {
        font-size: 46px;
        font-weight: 500;
        color: rgba(250,250,250,0.9);
        text-align: center;
        letter-spacing: -0.5px;
        opacity: 0;
        transform: translateY(24px);
      }

      #scene5-logo-outro .tagline-accent {
        font-size: 54px;
        font-weight: 800;
        color: #3B82F6;
        text-align: center;
        letter-spacing: -1.5px;
        margin-bottom: 36px;
        opacity: 0;
        transform: translateY(24px);
      }

      #scene5-logo-outro .url-pill {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(15,23,42,0.9);
        border: 1px solid rgba(59,130,246,0.3);
        border-radius: 100px;
        padding: 12px 32px;
        opacity: 0;
        transform: translateY(16px);
      }

      #scene5-logo-outro .url-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #0080FF;
        box-shadow: 0 0 10px #0080FF;
      }

      #scene5-logo-outro .url-text {
        font-size: 20px;
        font-weight: 600;
        color: rgba(250,250,250,0.6);
        letter-spacing: 1px;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        const bgGrid     = document.querySelector('#scene5-logo-outro .bg-grid');
        const glowCenter = document.querySelector('#scene5-logo-outro .glow-center');
        const glowTop    = document.querySelector('#scene5-logo-outro .glow-top');
        const logoWrap   = document.querySelector('#scene5-logo-outro .logo-wrap');
        const tagline    = document.querySelector('#scene5-logo-outro .tagline');
        const taglineAcc = document.querySelector('#scene5-logo-outro .tagline-accent');
        const urlPill    = document.querySelector('#scene5-logo-outro .url-pill');

        // Grid fades in
        tl.to(bgGrid, { opacity: 1, duration: 0.8, ease: 'power2.out' }, 0);

        // Glows bloom
        tl.to(glowCenter, { opacity: 1, scale: 1, duration: 1.0, ease: 'power2.out' }, 0.1);
        tl.to(glowTop,    { opacity: 1, scale: 1, duration: 0.8, ease: 'power2.out' }, 0.2);

        // Logo slides in from above
        tl.to(logoWrap, {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.8,
          ease: 'back.out(1.4)',
        }, 0.4);

        // Tagline lines rise in
        tl.to(tagline,    { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 1.1);
        tl.to(taglineAcc, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 1.4);

        // URL pill
        tl.to(urlPill, { opacity: 1, y: 0, duration: 0.6, ease: 'back.out(1.5)' }, 1.9);

        // Subtle glow pulse
        tl.to(glowCenter, {
          scale: 1.15,
          duration: 1.2,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: 1,
        }, 2.2);

        window.__timelines = window.__timelines || {};
        window.__timelines['scene5-logo-outro'] = tl;
      })();
    </script>
  </div>
</template>
