    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        const heroSection = document.querySelector('#scene2-4-canvas .hero-section');
        const featSection = document.querySelector('#scene2-4-canvas .features-section');
        const ctaSection  = document.querySelector('#scene2-4-canvas .cta-section');
        const heroBadge   = document.querySelector('#scene2-4-canvas .hero-badge');
        const heroLine1   = document.querySelector('#scene2-4-canvas .hero-line-1');
        const heroLine2   = document.querySelector('#scene2-4-canvas .hero-line-2');
        const heroSub     = document.querySelector('#scene2-4-canvas .hero-sub');
        const heroStats   = document.querySelector('#scene2-4-canvas .hero-stats');
        const featHeading = document.querySelector('#scene2-4-canvas .features-heading');
        const featCards   = document.querySelectorAll('#scene2-4-canvas .feature-card');
        const stars       = document.querySelector('#scene2-4-canvas .stars');
        const quote       = document.querySelector('#scene2-4-canvas .testimonial-quote');
        const author      = document.querySelector('#scene2-4-canvas .testimonial-author');
        const ctaRow      = document.querySelector('#scene2-4-canvas .cta-row');
        const ctaUrl      = document.querySelector('#scene2-4-canvas .cta-url');
        const ctaBtn      = document.querySelector('#scene2-4-canvas .cta-button');

        /* ── PHASE 1: HERO (0 → 5.5s) ── */
        tl.to(heroSection, { opacity: 1, duration: 0.01 }, 0);
        tl.to(heroBadge, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.3);
        tl.to(heroLine1, { opacity: 1, y: 0, duration: 0.7, ease: 'power4.out' }, 0.7);
        tl.to(heroLine2, { opacity: 1, y: 0, duration: 0.7, ease: 'power4.out' }, 1.0);
        tl.to(heroSub,   { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 1.5);
        tl.to(heroStats, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 2.0);

        tl.to(heroSection, { opacity: 0, y: -40, duration: 0.5, ease: 'power3.in' }, 5.0);

        /* ── PHASE 2: FEATURES (5.5 → 11s) ── */
        tl.to(featSection, { opacity: 1, duration: 0.01 }, 5.5);
        tl.to(featHeading, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 5.6);
        tl.to(featCards, {
          opacity: 1,
          y: 0,
          duration: 0.65,
          stagger: 0.18,
          ease: 'back.out(1.3)',
        }, 6.0);

        tl.to(featSection, { opacity: 0, y: -40, duration: 0.5, ease: 'power3.in' }, 10.3);

        /* ── PHASE 3: TESTIMONIAL + CTA (10.8 → 16.5s) ── */
        tl.to(ctaSection, { opacity: 1, duration: 0.01 }, 10.8);
        tl.to(stars,  { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.5)' }, 11.0);
        tl.to(quote,  { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 11.5);
        tl.to(author, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 12.3);
        tl.to(ctaRow, { opacity: 1, y: 0, duration: 0.6, ease: 'back.out(1.4)' }, 13.0);
        tl.to(ctaUrl, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 13.6);

        tl.to(ctaBtn, {
          boxShadow: '0 0 60px rgba(0,128,255,0.7), 0 4px 24px rgba(0,128,255,0.4)',
          duration: 0.6,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: 3,
        }, 13.2);

        // Exit: wipe left
        tl.to(ctaSection, { x: -2000, duration: 0.5, ease: 'expo.in' }, 16.5);

        window.__timelines = window.__timelines || {};
        window.__timelines['scene2-4-canvas'] = tl;
      })();
